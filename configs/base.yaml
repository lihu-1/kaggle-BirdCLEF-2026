competition:
  name: "BirdCLEF 2026"
  slug: "birdclef-2026"
  metric: "competition-defined audio classification score"

data:
  input_dir: null  # null => KAGGLE_INPUT_DIR, then data/raw
  target: "labels"

validation:
  strategy: "recording/site/time-grouped validation to prevent source leakage"
  n_splits: 5
  shuffle: true

run:
  seed: 42
  deterministic: false
  output_root: outputs

model:
  name: baseline
  params: {}

